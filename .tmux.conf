# Auto install TPM if missing
if-shell '[ ! -d ~/.tmux/plugins/tpm ]' \
  'run "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm"'

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-f
unbind C-b
bind-key C-f send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

unbind-key w
bind-key w choose-session

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on
set-option -g status-position top

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
# catppuccin/tmux is intentionally not listed here: it's sourced directly
# below (before status-right is built) instead of via TPM, so it must not
# also be loaded a second time through TPM or it resets window-status-format
# / window-status-current-format after they're set. Update it manually with
# `git -C ~/.tmux/plugins/tmux pull`.
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin directly so its status-module variables exist before
# status-right is built below, and before tmux-cpu/tmux-battery (loaded by
# TPM further down) substitute their #{cpu_percentage}/#{battery_percentage}
# placeholders into the already-built status-right string.
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -g status-style "bg=default,fg=white"
set -g status-left "#[bg=default,fg=white]"
set -g window-status-format "#[fg=#11111b,bg=#{@thm_overlay_2}]#[fg=#181825,reverse]#[none]#I #[fg=#cdd6f4,bg=#{@thm_surface_0}] #W#[fg=#181825,reverse]#[none]"
set -g window-status-current-format "#[fg=#11111b,bg=#{@thm_mauve}]#[fg=#181825,reverse]#[none]#I #[fg=#cdd6f4,bg=#{@thm_surface_1}] #W#[fg=#181825,reverse]#[none]"

# Initialize TMUX plugin manager (must run after status-right is set, so
# tmux-cpu/tmux-battery can substitute their placeholders into it)
run '~/.tmux/plugins/tpm/tpm'

set -sg escape-time 0
